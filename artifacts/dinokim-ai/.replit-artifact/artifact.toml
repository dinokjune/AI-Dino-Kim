kind = "web"
previewPath = "/"
title = "디노킴 AI 활용 정보 사이트"
version = "1.0.0"
id = "artifacts/dinokim-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22206

[services.development]
run = "pnpm --filter @workspace/dinokim-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dinokim-ai", "run", "build" ]
publicDir = "artifacts/dinokim-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22206"
BASE_PATH = "/"
